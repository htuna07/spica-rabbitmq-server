name: Spica Advisor

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  advise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: spica-engine/spica-advisor@main
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
