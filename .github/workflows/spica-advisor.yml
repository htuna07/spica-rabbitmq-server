name: Spica Advisor

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  advise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: htuna07/spica-advisor@main
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
